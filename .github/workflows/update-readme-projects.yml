name: Atualizar Projetos no README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Buscar Repositórios e Atualizar README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = '7silasmelo7';

            const response = await github.rest.repos.listForUser({
              username: username,
              sort: 'updated',
              per_page: 100
            });

            const projetosDestaque = response.data.filter(repo => 
              repo.topics && repo.topics.includes('destaque')
            );

            let markdownContent = '\n| Projeto | Descrição | Linguagem |\n| :--- | :--- | :--- |\n';
            
            projetosDestaque.forEach(repo => {
              const name = repo.name.replace(/-/g, ' ');
              const desc = repo.description ? repo.description : 'Projeto no GitHub.';
              const lang = repo.language ? `\`${repo.language}\`` : 'N/A';
              markdownContent += `| 🚀 **[${name}](${repo.html_url})** | ${desc} | ${lang} |\n`;
            });
            markdownContent += '\n';

            const readmePath = 'README.md';
            if (fs.existsSync(readmePath)) {
              let readme = fs.readFileSync(readmePath, 'utf8');
              const startTag = '<!-- START_SECTION:projects -->';
              const endTag = '<!-- END_SECTION:projects -->';

              const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`, 'g');
              const newReadme = readme.replace(regex, `${startTag}${markdownContent}${endTag}`);

              fs.writeFileSync(readmePath, newReadme);
            }

      - name: Commitar alterações no README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git diff --quiet || (git commit -m "bot: atualização automática dos projetos em destaque" && git push)