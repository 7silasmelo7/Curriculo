name: Atualizar Projetos no README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Buscar Repositórios e Atualizar README
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const username = '7silasmelo7';

            // Mapeamento de badges para Shields.io
            const badgeMap = {
              'JavaScript': '![JavaScript](https://img.shields.io/badge/JavaScript-F7DF1E?style=for-the-badge&logo=javascript&logoColor=black)',
              'HTML': '![HTML5](https://img.shields.io/badge/HTML5-E34F26?style=for-the-badge&logo=html5&logoColor=white)',
              'CSS': '![CSS3](https://img.shields.io/badge/CSS3-1572B6?style=for-the-badge&logo=css3&logoColor=white)',
              'Python': '![Python](https://img.shields.io/badge/Python-3776AB?style=for-the-badge&logo=python&logoColor=white)',
              'Java': '![Java](https://img.shields.io/badge/Java-ED8B00?style=for-the-badge&logo=openjdk&logoColor=white)',
              'TypeScript': '![TypeScript](https://img.shields.io/badge/TypeScript-3178C6?style=for-the-badge&logo=typescript&logoColor=white)'
            };

            const response = await github.rest.repos.listForUser({
              username: username,
              sort: 'updated',
              per_page: 100
            });

            const projetosDestaque = response.data.filter(repo => 
              repo.topics && repo.topics.includes('destaque')
            );

            // 1. Atualizar Tabela de Projetos
            let projectsMarkdown = '\n| Projeto | Descrição | Linguagem |\n| :--- | :--- | :--- |\n';
            const linguagensUsadas = new Set();

            // Buscar linguagens detalhadas de cada projeto
            for (const repo of projetosDestaque) {
              const name = repo.name.replace(/-/g, ' ');
              const desc = repo.description ? repo.description : 'Projeto no GitHub.';
              const langDisplay = repo.language ? `\`${repo.language}\`` : 'N/A';
              
              projectsMarkdown += `| 🚀 **[${name}](${repo.html_url})** | ${desc} | ${langDisplay} |\n`;

              // Requisita todas as linguagens do repositório (ex: HTML, CSS, JS)
              try {
                const langsResponse = await github.rest.repos.listLanguages({
                  owner: username,
                  repo: repo.name
                });
                
                Object.keys(langsResponse.data).forEach(lang => {
                  linguagensUsadas.add(lang);
                });
              } catch (e) {
                if (repo.language) linguagensUsadas.add(repo.language);
              }
            }
            projectsMarkdown += '\n';

            // 2. Gerar Badges da Tech Stack Dinâmica
            let stackMarkdown = '\n<div align="center">\n\n### **Linguagens em Destaque nos Projetos**\n';
            linguagensUsadas.forEach(lang => {
              if (badgeMap[lang]) {
                stackMarkdown += `${badgeMap[lang]} `;
              }
            });
            stackMarkdown += '\n\n</div>\n';

            // 3. Gravar no README.md
            const readmePath = 'README.md';
            if (fs.existsSync(readmePath)) {
              let readme = fs.readFileSync(readmePath, 'utf8');

              // Atualiza seção de projetos
              const projStart = '<!-- START_SECTION:projects -->';
              const projEnd = '<!-- END_SECTION:projects -->';
              const projRegex = new RegExp(`${projStart}[\\s\\S]*?${projEnd}`, 'g');
              readme = readme.replace(projRegex, `${projStart}${projectsMarkdown}${projEnd}`);

              // Atualiza seção de Tech Stack
              const stackStart = '<!-- START_SECTION:techstack -->';
              const stackEnd = '<!-- END_SECTION:techstack -->';
              const stackRegex = new RegExp(`${stackStart}[\\s\\S]*?${stackEnd}`, 'g');
              readme = readme.replace(stackRegex, `${stackStart}${stackMarkdown}${stackEnd}`);

              fs.writeFileSync(readmePath, readme);
            }

      - name: Commitar alterações no README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: atualização automática dos projetos em destaque" && git push)


      
          